<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" fill="none">
  <!-- Mock promo artwork: daily lucky wheel. Replace with real banner art later. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A1414"/>
      <stop offset="1" stop-color="#0C0707"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 160) scale(220)">
      <stop stop-color="#E0A35A" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#E0A35A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F6E2BC"/>
      <stop offset="1" stop-color="#9C7C50"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.4" cy="0.35" r="0.7">
      <stop stop-color="#FFF1D6"/>
      <stop offset="1" stop-color="#A88A5E"/>
    </radialGradient>
    <circle id="bulb" r="5" fill="#FFF1D6"/>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <rect width="640" height="320" fill="url(#glow)"/>
  <path d="M330 320 L430 0 H640 V320 Z" fill="#FFFFFF" fill-opacity="0.03"/>
  <g transform="translate(-180 0)">

  <g transform="rotate(-8 500 166)">
    <circle cx="500" cy="166" r="122" fill="url(#rim)"/>
    <circle cx="500" cy="166" r="108" fill="#3A1F1A"/>
    <!-- 12 alternating segments drawn with a dashed stroke -->
    <circle cx="500" cy="166" r="54" stroke="#C4AB8C" stroke-width="108" stroke-dasharray="28.274 28.274"/>
    <circle cx="500" cy="166" r="108" stroke="#2A1414" stroke-opacity="0.35" stroke-width="2"/>
    <use href="#bulb" x="615" y="166"/>
    <use href="#bulb" x="599.6" y="223.5"/>
    <use href="#bulb" x="557.5" y="265.6"/>
    <use href="#bulb" x="500" y="281"/>
    <use href="#bulb" x="442.5" y="265.6"/>
    <use href="#bulb" x="400.4" y="223.5"/>
    <use href="#bulb" x="385" y="166"/>
    <use href="#bulb" x="400.4" y="108.5"/>
    <use href="#bulb" x="442.5" y="66.4"/>
    <use href="#bulb" x="500" y="51"/>
    <use href="#bulb" x="557.5" y="66.4"/>
    <use href="#bulb" x="599.6" y="108.5"/>
    <circle cx="500" cy="166" r="22" fill="url(#hub)"/>
    <circle cx="500" cy="166" r="8" fill="#7A5A33"/>
  </g>
  <!-- pointer -->
  <path d="M486 30 H514 L500 60 Z" fill="url(#rim)" stroke="#2A1414" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
