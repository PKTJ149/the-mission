<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" fill="none">
  <!-- Mock promo artwork: first-deposit bonus (coin stacks). Replace with real banner art later. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2B2319"/>
      <stop offset="1" stop-color="#0D0B08"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 170) scale(240)">
      <stop stop-color="#C4AB8C" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#C4AB8C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F6E2BC"/>
      <stop offset="1" stop-color="#B8986A"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7A6141"/>
      <stop offset="0.5" stop-color="#C4AB8C"/>
      <stop offset="1" stop-color="#6B5538"/>
    </linearGradient>
    <g id="coin">
      <path d="M-44 0 V12 A44 15 0 0 0 44 12 V0 Z" fill="url(#side)"/>
      <ellipse cx="0" cy="0" rx="44" ry="15" fill="url(#face)"/>
      <ellipse cx="0" cy="0" rx="31" ry="10" stroke="#8A6E47" stroke-opacity="0.55" stroke-width="2"/>
    </g>
    <path id="spark" d="M0 -11 L2.6 -2.6 L11 0 L2.6 2.6 L0 11 L-2.6 2.6 L-11 0 L-2.6 -2.6 Z" fill="#F6E2BC"/>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <rect width="640" height="320" fill="url(#glow)"/>
  <path d="M330 320 L430 0 H640 V320 Z" fill="#FFFFFF" fill-opacity="0.035"/>
  <g transform="translate(-180 0)">

  <!-- back stack -->
  <use href="#coin" x="430" y="244"/>
  <use href="#coin" x="430" y="230"/>
  <use href="#coin" x="430" y="216"/>
  <use href="#coin" x="430" y="202"/>
  <use href="#coin" x="430" y="188"/>
  <use href="#coin" x="430" y="174"/>
  <!-- tall stack -->
  <use href="#coin" x="530" y="262"/>
  <use href="#coin" x="530" y="248"/>
  <use href="#coin" x="530" y="234"/>
  <use href="#coin" x="530" y="220"/>
  <use href="#coin" x="530" y="206"/>
  <use href="#coin" x="530" y="192"/>
  <use href="#coin" x="530" y="178"/>
  <use href="#coin" x="530" y="164"/>
  <use href="#coin" x="530" y="150"/>
  <use href="#coin" x="530" y="136"/>
  <!-- tilted coin -->
  <g transform="translate(590 86) rotate(-28)">
    <ellipse cx="0" cy="0" rx="26" ry="26" fill="url(#side)"/>
    <ellipse cx="-3" cy="-2" rx="24" ry="24" fill="url(#face)"/>
    <ellipse cx="-3" cy="-2" rx="16" ry="16" stroke="#8A6E47" stroke-opacity="0.55" stroke-width="2"/>
  </g>

  <use href="#spark" x="402" y="96"/>
  <use href="#spark" x="612" y="170" transform="scale(1)"/>
  <use href="#spark" x="476" y="58" opacity="0.6"/>
  </g>
</svg>
