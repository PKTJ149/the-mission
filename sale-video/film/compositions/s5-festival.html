      const reach = [54, 242, 430, 618, 806, 994].map((h) => h / 994); // the line's length to each festival's dot

      const stops = [0, 2.17, 4.33, 6.5, 8.67, 10.83];
      stops.forEach((t, i) => {
        const n = i + 1;
        if (i > 0) {
          tl.to("#s5-n" + i, { opacity: 0, filter: "blur(8px)", duration: 0.12 }, t - 0.1);
          tl.to("#s5-p" + i, OFF, t);

        tl.to("#s5-p" + n, ON, t);

      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

        X(2).dataset.built = "1";

          const sz = 60 + rnd() * 80, zone = i % 3, x = zone === 0 ? -20 + rnd() * 240 : zone === 1 ? 800 + rnd() * 250 : -10 + rnd() * 320;

          h.setAttribute("viewBox", "0 0 24 22");
          h.setAttribute("class", "s5-heart");

          X(2).appendChild(h);

          const d = document.createElement("div");
          d.className = "s5-drop";
          const left = i % 2 === 0;
          d.style.cssText = "position:absolute;left:" + (left ? 140 : 940) + "px;top:120px;width:" + (14 + rnd() * 16).toFixed(0) + "px;height:" + (20 + rnd() * 20).toFixed(0) + "px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 30%,#fff,#8fe0ff 40%,#2aa7e8);opacity:0";
          d.dataset.dx = ((left ? -1 : 1) * (40 + rnd() * 160)).toFixed(0);
          d.dataset.dy = (120 + rnd() * 260).toFixed(0);
          X(3).appendChild(d);
        }
        // Loy Krathong: firework bursts
        [[190, 200, "#ffd36b"], [900, 150, "#ff7ad9"], [880, 520, "#8fe9ff"], [150, 1660, "#ffb36b"], [960, 1720, "#b98aff"], [560, 70, "#fff1a8"]].forEach(([x, y, c], b) => {
          const g = document.createElement("div");

          for (let k = 0; k < 18; k++) {
            const r = document.createElement("i");
            r.style.cssText = "position:absolute;left:0;top:0;width:" + (90 + (k % 3) * 25) + "px;height:4px;border-radius:2px;transform-origin:0 50%;transform:rotate(" + k * 20 + "deg);background:linear-gradient(90deg,transparent," + c + ");box-shadow:0 0 10px " + c;
            g.appendChild(r);

          X(5).appendChild(g);

          X(6).appendChild(f);

      const win = [[0, 2.17], [2.17, 4.33], [4.33, 6.5], [6.5, 8.67], [8.67, 10.83], [10.83, 12.4]];

      tl.fromTo(".s5-lan", { y: -220, rotation: -8, transformOrigin: "50% 0%" }, { y: 0, rotation: 5, duration: 0.6, ease: "back.out(1.4)", stagger: 0.06 }, 0);

      // สงกรานต์: water is thrown in from both sides and the top
      tl.fromTo("#s5-sp1", { scale: 0.2, x: -160, y: 200, opacity: 0, transformOrigin: "30% 100%" }, { scale: 1, x: 0, y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 4.38);
      tl.fromTo("#s5-sp2", { scaleX: 0.2, scaleY: -0.2, rotation: -15, x: -160, y: -160, opacity: 0, transformOrigin: "50% 50%" }, { scaleX: 1, scaleY: -1, rotation: -15, x: 0, y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 4.5);
      tl.fromTo("#s5-sp3", { scaleX: -0.2, scaleY: -0.2, rotation: 15, x: 160, y: -160, opacity: 0, transformOrigin: "50% 50%" }, { scaleX: -1, scaleY: -1, rotation: 15, x: 0, y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 4.42);

        const t0 = 4.4 + (i % 8) * 0.12;
        tl.fromTo(d, { x: 0, opacity: 1 }, { x: +d.dataset.dx, duration: 1.1, ease: "none" }, t0);
        tl.fromTo(d, { y: 0 }, { y: +d.dataset.dy, duration: 1.1, ease: "power2.in" }, t0);
        tl.to(d, { opacity: 0, duration: 0.3 }, t0 + 0.8);
      });
      // ฮาโลวีน: moon and castle rise, bats flutter, pumpkins pop up
      tl.fromTo("#s5-moon", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 6.5);
      tl.fromTo("#s5-castle", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 6.55);
      tl.fromTo("#s5-bats", { x: -120, y: 40, opacity: 0 }, { x: 60, y: -10, opacity: 1, duration: 2.0, ease: "sine.out" }, 6.5);
      tl.fromTo("#s5-bats", { scaleY: 1 }, { scaleY: 0.82, duration: 0.12, yoyo: true, repeat: 15, ease: "sine.inOut", transformOrigin: "50% 50%" }, 6.5);
      tl.fromTo("#s5-pump", { y: 220, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, 6.65);
      // ลอยกระทง: fireworks, one after another
      document.querySelectorAll("#s5-x5 .s5-fw").forEach((g, i) => {
        const t0 = 8.72 + i * 0.32;
        tl.fromTo(g, { scale: 0.05, opacity: 1 }, { scale: 1, duration: 0.7, ease: "power3.out" }, t0);
        tl.to(g, { opacity: 0, y: 30, duration: 0.5, ease: "power1.in" }, t0 + 0.55);
      });
      // คริสต์มาส: snow falls
      tl.fromTo(".s5-snow", { y: 0, x: 0 }, { y: (i) => 380 + (i % 5) * 90, x: (i) => ((i * 53) % 80) - 40, duration: 2.4, ease: "none" }, 10.83);
      // hand-off to shot 6a: phone to the centre, the calendar fades
      tl.to(["#s5-p1", "#s5-p2", "#s5-p3", "#s5-p4", "#s5-p5", "#s5-p6", "#s5-rail", "#s5-fill", "#s5-cal", ".s5-dot", "#s5-sub", "#s5-n6"], { opacity: 0, filter: "blur(6px)", duration: 0.3 }, 12.4);

      tl.to("#s5-rig", { rotationY: -8, rotationX: 5, rotationZ: 0, duration: 0.6, ease: "power2.inOut" }, 12.4);

      const outer = gsap.timeline({ paused: true });
      outer.to(tl, { time: 13, duration: 8.4, ease: "none" }, 0);
