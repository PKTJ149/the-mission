    <div class="sub" id="s4-row" style="top: 345px"><span id="s4-n1" class="dimw">พื้นหลัง</span> → <span id="s4-n2" class="dimw">ตัวเกม</span> → <span id="s4-n3" class="dimw">สีทั้งหน้า</span></div>

    <div class="holder" id="s4-holder" style="left: 262px; top: 470px">
      <div class="rig" id="s4-rig">
        <img class="scr" src="assets/games/20-gold-boxes/screen-2-grid.png" alt="" />
        <!-- the same ถุงทองเงินล้าน screen three times, split by masks: background, each item, UI -->
        <div class="s4-lay" id="s4-bg"><img src="assets/games/11-cny-pouch/screen-2-grid.png" alt="" style="-webkit-mask-image: url(assets/masks/s4-bg.png); mask-image: url(assets/masks/s4-bg.png)" /></div>
        <div class="s4-lay" id="s4-i1" style="transform-origin: 140px 419px"><img src="assets/games/11-cny-pouch/screen-2-grid.png" alt="" style="-webkit-mask-image: url(assets/masks/s4-item-1.png); mask-image: url(assets/masks/s4-item-1.png)" /></div>
        <div class="s4-lay" id="s4-i2" style="transform-origin: 305px 419px"><img src="assets/games/11-cny-pouch/screen-2-grid.png" alt="" style="-webkit-mask-image: url(assets/masks/s4-item-2.png); mask-image: url(assets/masks/s4-item-2.png)" /></div>
        <div class="s4-lay" id="s4-i3" style="transform-origin: 470px 419px"><img src="assets/games/11-cny-pouch/screen-2-grid.png" alt="" style="-webkit-mask-image: url(assets/masks/s4-item-3.png); mask-image: url(assets/masks/s4-item-3.png)" /></div>
        <div class="s4-lay" id="s4-i4" style="transform-origin: 140px 569px"><img src="assets/games/11-cny-pouch/screen-2-grid.png" alt="" style="-webkit-mask-image: url(assets/masks/s4-item-4.png); mask-image: url(assets/masks/s4-item-4.png)" /></div>
        <div class="s4-lay" id="s4-i5" style="transform-origin: 305px 569px"><img src="assets/games/11-cny-pouch/screen-2-grid.png" alt="" style="-webkit-mask-image: url(assets/masks/s4-item-5.png); mask-image: url(assets/masks/s4-item-5.png)" /></div>
        <div class="s4-lay" id="s4-i6" style="transform-origin: 470px 569px"><img src="assets/games/11-cny-pouch/screen-2-grid.png" alt="" style="-webkit-mask-image: url(assets/masks/s4-item-6.png); mask-image: url(assets/masks/s4-item-6.png)" /></div>
        <div class="s4-lay" id="s4-i7" style="transform-origin: 140px 726px"><img src="assets/games/11-cny-pouch/screen-2-grid.png" alt="" style="-webkit-mask-image: url(assets/masks/s4-item-7.png); mask-image: url(assets/masks/s4-item-7.png)" /></div>
        <div class="s4-lay" id="s4-i8" style="transform-origin: 305px 726px"><img src="assets/games/11-cny-pouch/screen-2-grid.png" alt="" style="-webkit-mask-image: url(assets/masks/s4-item-8.png); mask-image: url(assets/masks/s4-item-8.png)" /></div>
        <div class="s4-lay" id="s4-i9" style="transform-origin: 470px 726px"><img src="assets/games/11-cny-pouch/screen-2-grid.png" alt="" style="-webkit-mask-image: url(assets/masks/s4-item-9.png); mask-image: url(assets/masks/s4-item-9.png)" /></div>

        <div id="s4-band" style="position: absolute; top: 0; left: -200px; width: 170px; height: 1245px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent); opacity: 0"></div>
        <div id="s4-band2" style="position: absolute; top: -200px; left: 0; width: 600px; height: 170px; background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.6), transparent); opacity: 0"></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      window.buildPhone(document.getElementById("s4-rig"));
      const tl = gsap.timeline({ paused: true });
      const lit = { color: "#8fe9ff", textShadow: "0 0 30px rgba(80,210,255,.9)", duration: 0.15 };
      const dim = { color: "#9c92cc", textShadow: "0 0 0px rgba(80,210,255,0)", duration: 0.15 };
      tl.fromTo("#s4-holder", { scale: 0.82, x: 0 }, { scale: 0.82, x: 0, duration: 0.01 }, 0);
      tl.fromTo("#s4-rig", { rotationY: -14, rotationX: 6, rotationZ: 1 }, { rotationY: -20, rotationX: 6, rotationZ: 1, duration: 4.2, ease: "sine.inOut" }, 0);
      tl.fromTo("#s4-row", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.05);
      const word = (out, inn, n0, n1, t) => {
        if (out) tl.to(out, { opacity: 0, filter: "blur(8px)", duration: 0.12 }, t - 0.1);
        tl.fromTo(inn, { opacity: 0, filter: "blur(8px)", y: 12 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.3, ease: "power3.out" }, t);
        if (n0) tl.to(n0, dim, t);
        tl.to(n1, lit, t);
      };
      // wave 1: background (light sweeps left to right)
      word(null, "#s4-t1", null, "#s4-n1", 0.15);
      tl.fromTo("#s4-bg", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power2.inOut" }, 0.3);
      tl.fromTo("#s4-band", { x: 0, opacity: 1 }, { x: 800, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 0.3);
      tl.set("#s4-band", { opacity: 0 }, 0.92);
      // wave 2: items, one by one
      word("#s4-t1", "#s4-t2", "#s4-n1", "#s4-n2", 1.3);
      ["#s4-i1", "#s4-i2", "#s4-i3", "#s4-i4", "#s4-i5", "#s4-i6", "#s4-i7", "#s4-i8", "#s4-i9"].forEach((el, i) =>
        tl.fromTo(el, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.4 + i * 0.06),
      );
      // wave 3: counters, buttons and text colours (light sweeps top to bottom)
      word("#s4-t2", "#s4-t3", "#s4-n2", "#s4-n3", 2.4);
      tl.fromTo("#s4-ui", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power2.inOut" }, 2.5);
      tl.fromTo("#s4-band2", { y: 0, opacity: 1 }, { y: 1450, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 2.5);
      tl.set("#s4-band2", { opacity: 0 }, 3.12);
      // hand-off: the phone moves to where shot 5 starts
      tl.to(["#s4-t3", "#s4-row"], { opacity: 0, filter: "blur(8px)", duration: 0.25 }, 4.2);
      tl.to("#s4-holder", { x: 100, scale: 1, duration: 0.6, ease: "power2.inOut" }, 4.2);
      tl.to("#s4-rig", { rotationY: -26, rotationX: 7, rotationZ: -2, duration: 0.6, ease: "power2.inOut" }, 4.2);
      window.__timelines["s4"] = tl;
    })();
  </script>
