<!doctype html>
<html lang="th" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Minigames sales video</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Look: SPEC.md draft 2 (after PK's reference film). Shared by every scene file. */
      @font-face { font-family: "PlexThai"; src: url("assets/fonts/IBMPlexSansThai-Medium.ttf"); font-weight: 500; }
      @font-face { font-family: "PlexThai"; src: url("assets/fonts/IBMPlexSansThai-SemiBold.ttf"); font-weight: 600; }
      @font-face { font-family: "PlexThai"; src: url("assets/fonts/IBMPlexSansThai-Bold.ttf"); font-weight: 700; }
      :root { --ink: #fff; --soft: #cfc6ff; --cyan: #8fe9ff; --edge: rgba(205, 195, 255, 0.75); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #090720; }
      #root { font-family: "PlexThai", sans-serif; color: var(--ink); }

      /* ground: three light pools and one beam (drift slowly on the root timeline) */
      #ground { position: absolute; inset: 0; background: #090720; overflow: hidden; }
      #ground .pool { position: absolute; border-radius: 50%; }
      #pool-violet { left: -270px; top: -350px; width: 1440px; height: 1100px; background: radial-gradient(closest-side, rgba(124, 92, 255, 0.55), transparent); }
      #pool-magenta { left: 350px; top: 900px; width: 1300px; height: 1450px; background: radial-gradient(closest-side, rgba(214, 58, 196, 0.42), transparent); }
      #pool-indigo { left: -40px; top: 560px; width: 1160px; height: 800px; background: radial-gradient(closest-side, rgba(60, 40, 170, 0.35), transparent); }
      #beam { position: absolute; left: -300px; top: -200px; width: 900px; height: 1400px; transform-origin: 50% 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1) 45%, rgba(255, 255, 255, 0.16) 50%, rgba(255, 255, 255, 0.1) 55%, transparent);
        filter: blur(30px); }

      /* type */
      .title { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 700; font-size: 104px; line-height: 1.2;
        text-shadow: 0 0 34px rgba(170, 150, 255, 0.65), 0 0 2px rgba(255, 255, 255, 0.8); }
      .sub { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 500; font-size: 50px; color: var(--soft);
        text-shadow: 0 0 20px rgba(140, 120, 255, 0.6); }
      .hl { color: var(--cyan); text-shadow: 0 0 30px rgba(80, 210, 255, 0.9), 0 0 2px #fff; }
      .dimw { color: #9c92cc; text-shadow: none; }
      .glass { position: absolute; border-radius: 36px; overflow: hidden; border: 2px solid var(--edge); background: rgba(40, 28, 90, 0.45);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 0 46px rgba(140, 115, 255, 0.55), 0 40px 90px rgba(0, 0, 0, 0.6); }
      .pill { display: inline-flex; align-items: center; padding: 14px 34px; border-radius: 999px; font-weight: 600; font-size: 40px; white-space: nowrap;
        background: rgba(60, 190, 255, 0.16); border: 2px solid #84e6ff; color: #e4faff; box-shadow: 0 0 26px rgba(80, 200, 255, 0.75), 0 0 2px #fff inset; }

      /* iPhone in CSS 3D: a .rig holds the screen content; buildPhone() adds the body around it */
      .holder { position: absolute; perspective: 2000px; transform-origin: 0 0; }
      .rig { position: relative; transform-style: preserve-3d; width: 648px; height: 1349px; }
      .rig .slab { position: absolute; inset: 0; border-radius: 96px; }
      .rig .btn { position: absolute; width: 10px; border-radius: 5px; background: linear-gradient(90deg, #55535c, #c4c1cc, #55535c); }
      .phone { position: relative; width: 648px; height: 1349px; border-radius: 96px; padding: 6px; transform: translateZ(0);
        background: linear-gradient(120deg, #e9e6f2 0%, #6d6a76 10%, #2e2d35 30%, #8f8c99 52%, #2b2a31 74%, #b9b6c4 92%, #55535d 100%);
        box-shadow: inset 3px 0 3px rgba(255, 255, 255, 0.75), inset -3px 0 4px rgba(0, 0, 0, 0.7), inset 0 3px 3px rgba(255, 255, 255, 0.45), 0 0 40px rgba(140, 115, 255, 0.45); }
      .phone .screen { position: relative; width: 636px; height: 1337px; border-radius: 90px; background: #000; overflow: hidden; }
      .phone .feed { position: absolute; left: 18px; top: 74px; width: 600px; height: 1245px; overflow: hidden; border-radius: 0 0 72px 72px; }
      .phone .feed img.scr { position: absolute; left: 0; top: 0; display: block; width: 600px; }
      .phone .status { position: absolute; left: 18px; top: 18px; width: 600px; height: 74px; z-index: 2; display: flex; justify-content: space-between;
        align-items: center; padding: 0 52px 0 64px; font-weight: 600; font-size: 32px; color: #fff; background: #000; border-radius: 72px 72px 0 0; }
      .phone .icons { display: flex; align-items: flex-end; gap: 5px; }
      .phone .icons b { display: block; width: 6px; background: #fff; border-radius: 2px; }
      .phone .bat { margin-left: 8px; width: 46px; height: 24px; border: 2px solid rgba(255, 255, 255, 0.55); border-radius: 7px; padding: 2px; align-self: center; }
      .phone .bat span { display: block; width: 80%; height: 100%; background: #fff; border-radius: 4px; }
      .phone .island { position: absolute; left: 50%; top: 32px; width: 176px; height: 52px; margin-left: -88px; background: #000; border-radius: 26px; z-index: 3; }
      .phone .sheen { position: absolute; inset: 18px; border-radius: 72px; z-index: 4; pointer-events: none;
        background: linear-gradient(118deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.08) 22%, transparent 38%, transparent 70%, rgba(255, 255, 255, 0.06) 100%); }
      .tap { position: absolute; border-radius: 50%; border: 5px solid var(--cyan); box-shadow: 0 0 30px rgba(80, 210, 255, 0.9), inset 0 0 20px rgba(80, 210, 255, 0.6); }
    </style>
    <script>
      // Builds the iPhone body around a .rig's children (moved, not copied, so their ids keep working).
      // 32 slabs x 2 px = 64 px depth, close to a real iPhone; keep turns within +-40 deg.
      window.buildPhone = function (rig) {
        if (rig.dataset.built) return;
        rig.dataset.built = "1";
        const feed = document.createElement("div");
        feed.className = "feed";
        while (rig.firstChild) feed.appendChild(rig.firstChild);
        const status =
          '<div class="status" data-layout-ignore><span>9:41</span><span class="icons"><b style="height:12px"></b><b style="height:17px"></b><b style="height:22px"></b><b style="height:27px"></b>' +
          '<svg width="36" height="26" viewBox="0 0 24 18" style="margin-left:8px"><path d="M12 16 L9 13 A4.5 4.5 0 0 1 15 13 Z M5.5 9.5 A9 9 0 0 1 18.5 9.5 L16.5 11.5 A6 6 0 0 0 7.5 11.5 Z M2 6 A14 14 0 0 1 22 6 L20 8 A11 11 0 0 0 4 8 Z" fill="#fff"/></svg>' +
          '<span class="bat"><span></span></span></span></div>';
        const phone = document.createElement("div");
        phone.className = "phone";
        phone.innerHTML = '<div class="screen">' + status + '<div class="island"></div><div class="sheen"></div></div>';
        phone.firstChild.insertBefore(feed, phone.firstChild.querySelector(".sheen"));
        const N = 32, STEP = 2;
        for (let k = N; k >= 1; k--) {
          const s = document.createElement("div");
          s.className = "slab";
          const l = Math.round(34 + 28 * Math.sin((Math.PI * k) / N));
          s.style.cssText =
            "transform:translateZ(" + -k * STEP + "px);background:linear-gradient(90deg,hsl(250,7%," + (l + 18) + "%),hsl(250,6%," + l + "%) 45%,hsl(250,6%," + (l - 14) + "%))" +
            (k === N ? ";box-shadow:60px 70px 120px rgba(0,0,0,.8),0 0 70px rgba(150,110,255,.45)" : "");
          rig.appendChild(s);
        }
        [["left:-5px;top:250px;height:60px"], ["left:-5px;top:360px;height:110px"], ["left:-5px;top:490px;height:110px"], ["right:-5px;top:400px;height:170px"]].forEach(([css]) => {
          const b = document.createElement("i");
          b.className = "btn";
          b.style.cssText = css + ";transform:translateZ(" + (-N * STEP) / 2 + "px)";
          rig.appendChild(b);
        });
        rig.appendChild(phone);
      };
    </script>
  </head>

    <script>
      // root timeline: only the ground drifts; every scene runs its own timeline
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#pool-violet", { x: 0, y: 0 }, { x: 120, y: 60, duration: 53.5, ease: "sine.inOut" }, 0);
      tl.fromTo("#pool-magenta", { x: 0, y: 0 }, { x: -140, y: -90, duration: 53.5, ease: "sine.inOut" }, 0);
      tl.fromTo("#beam", { rotation: -28, opacity: 0.9 }, { rotation: -22, opacity: 1, duration: 53.5, ease: "sine.inOut" }, 0);
      window.__timelines["main"] = tl;
